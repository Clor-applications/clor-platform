name = "clor-api-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

# api.clor.in is served entirely by this Worker.
routes = [{ pattern = "api.clor.in", custom_domain = true }]

[vars]
# The API server on AWS (deploy/aws), since the cutover of 23 Nov 2026.
# Going back to Cloud Run within the fallback week: put the old value here
# (https://clor-api-398490688104.asia-south1.run.app), `wrangler deploy`, and
# open the service again: gcloud run services update clor-api --ingress all.
ORIGIN = "https://origin.clor.in"

# Staging: api.staging.clor.in -> clor-api-staging (the *_staging databases).
# Deploy: wrangler deploy --env staging; secret: wrangler secret put EDGE_SECRET --env staging
[env.staging]
name = "clor-api-proxy-staging"
routes = [{ pattern = "api.staging.clor.in", custom_domain = true }]

[env.staging.vars]
ORIGIN = "https://clor-api-staging-398490688104.asia-south1.run.app"
