AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CLOR production on AWS (Mumbai): one always-on API server (EC2, Docker, Caddy)
  and one managed PostgreSQL database (RDS). Reached through the api.clor.in
  Cloudflare Worker, exactly as Cloud Run was. See deploy/aws/README.md.

# What this costs per month in ap-south-1 (AWS price list, 23 Nov 2026):
#   API server t3a.small ............ about $9
#   Database db.t4g.micro, 20 GB .... about $18   (db.t4g.small: about $33)
#   Server disk 30 GB, public IPv4 .. about $7
#   Backups, image store, secret .... about $2
# About $35 a month: $1,000 of credits last about 29 months.
# The two sizes are parameters; changing one is a few minutes of downtime.

Parameters:
  ApiInstanceType:
    Type: String
    Default: t3a.small
    AllowedValues: [t3a.small, t3a.medium, t4g.small, t4g.medium]
    Description: >-
      The API server. 2 vCPU and 2 GB serves 150-200 people; a medium doubles the
      memory. t3a is x86, t4g is ARM (a little cheaper): on 23 Nov 2026 Mumbai had
      no t4g capacity in any zone, so the default is t3a. The image is built for
      whichever this is (scripts/release-aws.sh reads it).
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium]
    Description: The database. micro (1 GB) to start; small (2 GB) when real customers arrive. It is the busy part of CLOR, so it is the first size to raise.
  DbEngineVersion:
    Type: String
    Default: '18.6'
    Description: PostgreSQL version. Must not be lower than the Cloud SQL one (18.6 on 23 Nov 2026), or the copy cannot be restored. Plain '18' picked 18.3.
  DbStorageGb:
    Type: Number
    Default: 20
    MinValue: 20
  ApiZone:
    Type: String
    Default: a
    AllowedValues: [a, b]
    Description: Which of the two zones the server runs in. If AWS says a zone has no capacity, use the other.
  DbDeletionProtection:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Keep true. Only the very first create passes false, so a failed create can clean up after itself; it is switched on straight after.
  GithubRepositorySubject:
    Type: String
    Default: Clor-applications@345664517/clor-platform@1416995327
    Description: The repository as GitHub names it in its sign-in tokens (organisation@number/repository@number).
  ApiAmiX86:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 for x86, newest at the time the stack is made.
  ApiAmiArm:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 for ARM.

Conditions:
  ApiInZoneA: !Equals [!Ref ApiZone, a]
  ApiIsArm: !Or [!Equals [!Ref ApiInstanceType, t4g.small], !Equals [!Ref ApiInstanceType, t4g.medium]]

Resources:
  # ---- Network: one small VPC, two public subnets (RDS wants two zones) ----
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: clor }]
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Gateway }
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: clor-a }]
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: clor-b }]
  Routes:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref Routes, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Gateway }
  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref Routes }
  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref Routes }

  # ---- Who may talk to what ----
  # The server answers on 80 and 443 only. There is no SSH port: commands reach
  # it through AWS Systems Manager, which needs no open port and no key file.
  # The API itself refuses any request that did not come through the Cloudflare
  # Worker (EDGE_SECRET), so an open 443 exposes /ready and nothing else.
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CLOR API server - web ports only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
  # The database accepts connections from the API server and from nowhere else.
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CLOR database - the API server only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ApiSecurityGroup }

  # ---- Database ----
  DbSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CLOR database subnets
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    # Deleting the stack keeps a final copy of the data, and a mistaken update
    # that would replace the database keeps one too.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: clor-pg
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbStorageGb
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: clor_admin
      # AWS makes and keeps the administrator password (Secrets Manager).
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnets
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      # A backup every night, kept 7 days, and restore to any minute in between.
      BackupRetentionPeriod: 7
      PreferredBackupWindow: 20:30-21:00 # 02:00 IST
      PreferredMaintenanceWindow: sun:21:30-sun:22:30 # Monday 03:00 IST
      AutoMinorVersionUpgrade: true
      DeletionProtection: !Ref DbDeletionProtection
      CopyTagsToSnapshot: true

  # ---- Where images and database copies are kept ----
  ImageStore:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: clor/api
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the last 8 releases",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":8},
            "action":{"type":"expire"}}]}
  ConsoleImageStore:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: clor/console
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the last 5",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
            "action":{"type":"expire"}}]}
  # Database copies on their way from Google Cloud, and nothing else.
  TransferBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - { Id: expire-copies, Status: Enabled, ExpirationInDays: 30 }

  # The API's own log lines (docker-compose.yml, the app service). Ops opens
  # them by request ID. Thirty days, as the lookup link asks for.
  ApiLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: clor/api
      RetentionInDays: 30

  # ---- The API server ----
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: clor-api-server
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Its own settings (deploy/aws/README.md, Secrets), and no others.
              - Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameters, ssm:GetParameter]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/clor/prod*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/clor/console*
              # The Engineering Console (it runs on this server) reads when the
              # database can be restored to. The image list it reads comes with
              # the ECR read-only policy above.
              - Effect: Allow
                Action: rds:DescribeDBInstances
                Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:clor-pg'
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt TransferBucket.Arn, !Sub '${TransferBucket.Arn}/*']
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !GetAtt ApiLogs.Arn # ends in :*, so it covers the streams
              # The database administrator password, for the one-time restore.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                # Named by pattern, not by reference: the server then does not
                # wait for the database, and a server that cannot be made is
                # known in the first minute, not after twenty.
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*'
  ApiProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref ApiRole] }
  ApiServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !If [ApiIsArm, !Ref ApiAmiArm, !Ref ApiAmiX86]
      InstanceType: !Ref ApiInstanceType
      IamInstanceProfile: !Ref ApiProfile
      SubnetId: !If [ApiInZoneA, !Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref ApiSecurityGroup]
      # "standard" credits: a burst never turns into a surprise bill.
      CreditSpecification: { CPUCredits: standard }
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: clor-api }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          systemctl enable --now docker
          # The compose plugin is not in Amazon Linux's repository.
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-$(uname -m)" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          dnf install -y amazon-ecr-credential-helper
          mkdir -p /root/.docker
          echo '{"credsStore":"ecr-login"}' > /root/.docker/config.json
          # 2 GB of swap: a memory spike slows the server instead of killing the API.
          fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          mkdir -p /opt/clor
  ApiAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: { Domain: vpc, InstanceId: !Ref ApiServer }

  # ---- Releases from GitHub Actions (.github/workflows/release.yml, rollback.yml) ----
  # GitHub signs in with a short-lived token it mints for one run: no key is
  # stored anywhere. Only runs of this repository in its `production`
  # environment (main only, approved by an owner) can take the role. The subject carries the organisation's and the repository's
  # numbers, because this organisation issues immutable subjects: a repository
  # recreated under the same name would not match.
  GithubSignIn:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  ReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: clor-release
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GithubSignIn }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GithubRepositorySubject}:environment:production'
      Policies:
        - PolicyName: clor-release
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # What scripts/release-aws.sh does, and no more.
              - Sid: ReadTheStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId
              - Sid: PushTheImage
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource: [!GetAtt ImageStore.Arn, !GetAtt ConsoleImageStore.Arn]
              - Sid: SnapshotBeforeMigrations
                Effect: Allow
                Action: [rds:CreateDBSnapshot, rds:DeleteDBSnapshot, rds:DescribeDBSnapshots, rds:AddTagsToResource]
                Resource:
                  - !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:clor-pg'
                  - !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:snapshot:clor-pg-rel-*'
              # Commands on the one server, as the release script sends them.
              - Sid: RunOnTheServer
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ApiServer}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: '*'

Outputs:
  ReleaseRoleArn:
    Description: The repository variable AWS_RELEASE_ROLE_ARN (GitHub, Settings, Environments).
    Value: !GetAtt ReleaseRole.Arn
  ApiServerId:
    Value: !Ref ApiServer
  ApiArchitecture:
    Description: What the API image must be built for.
    Value: !If [ApiIsArm, arm64, amd64]
  ApiPublicAddress:
    Description: Point a DNS-only A record (origin.clor.in) at this.
    Value: !GetAtt ApiAddress.PublicIp
  DatabaseHost:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseAdminSecret:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  ImageRepository:
    Value: !GetAtt ImageStore.RepositoryUri
  TransferBucket:
    Value: !Ref TransferBucket
