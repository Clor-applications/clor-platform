<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/clor-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/clor-icon-192.png" />
    <meta name="theme-color" content="#FF6B00" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      /* One build serves every app address; the address picks the app's own
         manifest, icon and colour so "Add to Home Screen" installs that app. */
      (function () {
        var app = (location.hostname.split('.')[0] || '').toLowerCase();
        if (['attendance', 'payroll', 'accounting', 'people'].indexOf(app) < 0) return;
        var m = document.querySelector('link[rel="manifest"]');
        if (m) m.href = '/manifest-' + app + '.webmanifest';
        var a = document.querySelector('link[rel="apple-touch-icon"]');
        /* People has no icon of its own yet: the CLOR mark until it does. */
        if (a) a.href = app === 'people' ? '/clor-icon-192.png' : '/icons/' + app + '-192.png';
        var t = document.querySelector('meta[name="theme-color"]');
        if (t) t.content = '#14152B';
        document.title = 'CLOR ' + app.charAt(0).toUpperCase() + app.slice(1);
      })();
    </script>
    <meta name="description" content="Clor — GST accounting, invoicing, inventory and payroll for Indian businesses." />
    <title>CLOR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
