<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>CLOR hero 3D</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Jakarta";
        src: url("assets/jakarta.woff2") format("woff2");
        font-weight: 200 800;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f6f9fd;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Jakarta", system-ui, sans-serif;
      }
      /* Light ground: white on the left (headline side), soft blue and orange washes right. */
      #ground {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(42% 55% at 88% 12%, rgba(255, 84, 0, 0.11), transparent 70%),
          radial-gradient(48% 60% at 72% 95%, rgba(59, 130, 246, 0.14), transparent 70%),
          linear-gradient(90deg, #ffffff 0%, #f8fafe 38%, #eef4fc 100%);
      }
      #three-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="ground" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>
      <canvas id="three-layer" class="clip" data-start="0" data-duration="10" data-track-index="1"></canvas>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      const W = 1920, H = 1080, LOOP = 10;
      const TAU = Math.PI * 2;
      const clamp = (v) => Math.min(1, Math.max(0, v));
      const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
      const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const rupees = (n) => "₹" + Math.round(n).toLocaleString("en-IN");

      /* ---------------------------------------------------------------- renderer */
      const canvas = document.getElementById("three-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x000000, 0);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
      // a soft studio room for reflections, so glass and spheres read as glossy
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.55;

      scene.add(new THREE.HemisphereLight(0xffffff, 0xcfdcf5, 1.7));
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(-4, 6, 8);
      scene.add(key);
      const warm = new THREE.PointLight(0xff7a33, 0, 6, 1.6);
      scene.add(warm);

      /* ----------------------------------------------------------- palette, icons */
      const TONE = { people: "#ff6b57", attendance: "#f59e0b", payroll: "#0ea5e9", books: "#6366f1" };
      const INK = "#0f172a", INK2 = "#475569", INK3 = "#94a3b8", LINE = "#e5e9f0";
      const ORANGE = "#ff5400", OK_BG = "#dcf5e6", OK_FG = "#15803d";
      const icons = {};

      function loadIcon(name, svg, color) {
        return new Promise((res) => {
          const img = new Image();
          img.onload = () => { icons[name] = img; res(); };
          img.onerror = () => res();
          img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replaceAll("currentColor", color));
        });
      }

      /* ------------------------------------------------------------- 2D helpers */
      function rr(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function text(ctx, s, x, y, size, weight = 500, color = INK, align = "left") {
        ctx.font = `${weight} ${size}px Jakarta`;
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.fillText(s, x, y);
      }
      function chip(ctx, s, xRight, y, alpha = 1) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.font = "700 24px Jakarta";
        const w = ctx.measureText(s).width + 40;
        rr(ctx, xRight - w, y - 22, w, 44, 22);
        ctx.fillStyle = OK_BG;
        ctx.fill();
        text(ctx, s, xRight - w / 2, y + 1, 24, 700, OK_FG, "center");
        ctx.restore();
      }

      const CW = 1100, CH = 700;
      /* Shared frame for every screen: white card, header bar with the product mark. */
      function frame(ctx, slug, name, title) {
        ctx.clearRect(0, 0, CW, CH);
        rr(ctx, 2, 2, CW - 4, CH - 4, 38);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(0, 0, CW, 100);
        ctx.fillStyle = LINE;
        ctx.fillRect(0, 100, CW, 2);
        ctx.restore();
        rr(ctx, 2, 2, CW - 4, CH - 4, 38);
        ctx.strokeStyle = LINE;
        ctx.lineWidth = 3;
        ctx.stroke();
        rr(ctx, 36, 24, 54, 54, 14);
        ctx.fillStyle = TONE[slug] + "22";
        ctx.fill();
        if (icons[slug]) ctx.drawImage(icons[slug], 46, 34, 34, 34);
        text(ctx, name, 108, 52, 34, 800);
        text(ctx, title, CW - 40, 52, 28, 500, INK2, "right");
      }
      function row(ctx, k, v, y, alpha = 1) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.fillStyle = LINE;
        ctx.fillRect(44, y - 34, CW - 88, 2);
        text(ctx, k, 44, y, 28, 500, INK2);
        text(ctx, v, CW - 44, y, 28, 600, INK, "right");
        ctx.restore();
      }

      /* ------------------------------------------------------------ the screens
       * Each draws itself at progress p (0 = waiting, 1 = done). Figures are the
       * site's sample company: 48 employees, October 2026.
       */
      function drawPeople(ctx, p) {
        frame(ctx, "people", "People", "Employee record");
        ctx.beginPath();
        ctx.arc(96, 176, 44, 0, TAU);
        ctx.fillStyle = TONE.people + "26";
        ctx.fill();
        text(ctx, "KI", 96, 178, 30, 800, "#c2410c", "center");
        if (p > 0) {
          ctx.save();
          ctx.globalAlpha *= p;
          ctx.beginPath();
          ctx.arc(96, 176, 52, 0, TAU);
          ctx.strokeStyle = ORANGE;
          ctx.lineWidth = 5;
          ctx.stroke();
          ctx.restore();
        }
        text(ctx, "Kavya Iyer", 170, 160, 38, 800);
        text(ctx, "Accounts executive, Pune office", 170, 202, 27, 500, INK2);
        row(ctx, "Employee ID", "E042", 300);
        row(ctx, "Joined", "3 June 2024", 370);
        row(ctx, "Manager", "Rohit Anand", 440);
        row(ctx, "Monthly salary", rupees(38400), 510);
        const docs = ["Offer letter", "PAN and Aadhaar", "Bank details"];
        let x = 44;
        docs.forEach((d, i) => {
          const a = smooth(0.15 + i * 0.22, 0.45 + i * 0.22, p);
          ctx.font = "600 24px Jakarta";
          const w = ctx.measureText(d).width + 40;
          rr(ctx, x, 584, w, 48, 24);
          ctx.fillStyle = "#f1f5f9";
          ctx.fill();
          if (a > 0) {
            ctx.save();
            ctx.globalAlpha *= a;
            rr(ctx, x, 584, w, 48, 24);
            ctx.fillStyle = OK_BG;
            ctx.fill();
            ctx.restore();
          }
          text(ctx, d, x + w / 2, 609, 24, 600, a > 0.5 ? OK_FG : INK3, "center");
          x += w + 14;
        });
      }

      const DAYS = "ppppwwppppplpppwwpppphppwwppppp".split(""); // 31 days of October
      function drawAttendance(ctx, p) {
        frame(ctx, "attendance", "Attendance", "October 2026");
        text(ctx, "Kavya Iyer", 44, 160, 32, 700);
        chip(ctx, "Ready to close", CW - 44, 160, smooth(0.9, 1, p));
        const cell = 56, gap = 10, cols = 16, x0 = 44, y0 = 210;
        DAYS.forEach((d, i) => {
          const c = i % cols, r = Math.floor(i / cols);
          const x = x0 + c * (cell + gap), y = y0 + r * (cell + gap);
          const a = smooth((i / 31) * 0.82, (i / 31) * 0.82 + 0.12, p);
          rr(ctx, x, y, cell, cell, 10);
          ctx.fillStyle = "#f3f5f8";
          ctx.fill();
          if (a > 0) {
            const col = d === "w" ? "#e6e9ef" : d === "l" ? "#f8d2a6" : d === "h" ? "#cfe9d9" : "#a9dcbd";
            const s = cell * (0.6 + 0.4 * a);
            ctx.save();
            ctx.globalAlpha *= a;
            rr(ctx, x + (cell - s) / 2, y + (cell - s) / 2, s, s, 10);
            ctx.fillStyle = col;
            ctx.fill();
            ctx.restore();
          }
        });
        const paid = 26.5 * smooth(0.05, 0.95, p);
        ctx.fillStyle = LINE;
        ctx.fillRect(44, 380, CW - 88, 2);
        text(ctx, "Paid days", 44, 430, 28, 500, INK2);
        text(ctx, paid.toFixed(1), 380, 430, 30, 800, INK, "right");
        text(ctx, "Leave", 450, 430, 28, 500, INK2);
        text(ctx, p > 0.55 ? "1" : "0", 700, 430, 30, 800, INK, "right");
        text(ctx, "Overtime", 770, 430, 28, 500, INK2);
        text(ctx, p > 0.75 ? "3 h" : "0 h", CW - 44, 430, 30, 800, INK, "right");
        text(ctx, "48 employees", 44, 520, 26, 600, INK2);
        rr(ctx, 44, 552, CW - 88, 16, 8);
        ctx.fillStyle = "#eef1f5";
        ctx.fill();
        if (p > 0) {
          rr(ctx, 44, 552, Math.max(16, (CW - 88) * p), 16, 8);
          ctx.fillStyle = TONE.attendance;
          ctx.fill();
        }
        text(ctx, `${Math.round(48 * p)} of 48 closed`, CW - 44, 610, 24, 600, INK3, "right");
      }

      function drawPayroll(ctx, p) {
        frame(ctx, "payroll", "Payroll", "Pay run, October 2026");
        text(ctx, "48 employees", 44, 160, 32, 700);
        chip(ctx, "Locked", CW - 44, 160, smooth(0.88, 1, p));
        const lines = [
          ["Gross pay", 1842600],
          ["Provident fund", -132400],
          ["Professional tax", -9600],
          ["TDS", -114800],
        ];
        lines.forEach(([k, v], i) => {
          const a = smooth(0.05 + i * 0.13, 0.25 + i * 0.13, p);
          const shown = Math.abs(v) * smooth(0.05 + i * 0.13, 0.4 + i * 0.13, p);
          row(ctx, k, a > 0 ? (v < 0 ? "− " + rupees(shown) : rupees(shown)) : "", 256 + i * 70, 0.35 + 0.65 * a);
        });
        ctx.fillStyle = INK;
        ctx.fillRect(44, 520, CW - 88, 3);
        const net = 1585800 * smooth(0.5, 0.9, p);
        text(ctx, "Net pay", 44, 572, 32, 800);
        text(ctx, rupees(net), CW - 44, 572, 36, 800, INK, "right");
        text(ctx, "Payslips go to every employee's phone", 44, 636, 24, 500, INK3);
      }

      function drawBooks(ctx, p) {
        frame(ctx, "books", "Books", "Journal, October 2026");
        text(ctx, "Salaries, October 2026", 44, 160, 32, 700);
        chip(ctx, "Posted", CW - 44, 160, smooth(0.88, 1, p));
        text(ctx, "Account", 44, 222, 24, 600, INK3);
        text(ctx, "Debit", 770, 222, 24, 600, INK3, "right");
        text(ctx, "Credit", CW - 44, 222, 24, 600, INK3, "right");
        const lines = [
          ["Salaries and wages", 1842600, 0],
          ["PF payable", 0, 132400],
          ["Professional tax payable", 0, 9600],
          ["TDS payable", 0, 114800],
          ["Bank", 0, 1585800],
        ];
        lines.forEach(([k, dr, cr], i) => {
          const a = smooth(0.05 + i * 0.13, 0.25 + i * 0.13, p);
          const y = 290 + i * 66;
          ctx.save();
          ctx.globalAlpha *= 0.3 + 0.7 * a;
          ctx.fillStyle = LINE;
          ctx.fillRect(44, y - 33, CW - 88, 2);
          text(ctx, k, 44, y, 27, 500, INK2);
          if (a > 0) {
            if (dr) text(ctx, rupees(dr), 770, y, 27, 700, INK, "right");
            if (cr) text(ctx, rupees(cr), CW - 44, y, 27, 700, INK, "right");
          }
          ctx.restore();
        });
        const tot = smooth(0.8, 1, p);
        ctx.fillStyle = INK;
        ctx.fillRect(44, 614, CW - 88, 3);
        text(ctx, "Total", 44, 654, 28, 800, INK);
        if (tot > 0) {
          ctx.save();
          ctx.globalAlpha *= tot;
          text(ctx, rupees(1842600), 770, 654, 28, 800, INK, "right");
          text(ctx, rupees(1842600), CW - 44, 654, 28, 800, INK, "right");
          ctx.restore();
        }
      }

      /* ------------------------------------------------------------- 3D panels */
      const PW = 3.3, PH = (PW * CH) / CW;
      function roundedShape(w, h, r) {
        const s = new THREE.Shape();
        const x = -w / 2, y = -h / 2;
        s.moveTo(x + r, y);
        s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
        s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
        s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
        return s;
      }
      function glowTexture(color, w, h, blur, radius) {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const g = c.getContext("2d");
        g.shadowColor = color;
        g.shadowBlur = blur;
        g.fillStyle = color;
        rr(g, blur * 1.2, blur * 1.2, w - blur * 2.4, h - blur * 2.4, radius);
        g.fill();
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }
      const shadowTex = glowTexture("rgba(30,41,80,0.9)", 512, 360, 60, 40);
      const rimTex = glowTexture("#ff5400", 512, 360, 44, 46);

      const SPECS = [
        { slug: "people", draw: drawPeople, pos: [0.9, 1.55, 0], rot: [0.04, 0.16, 0], ph: 0.0 },
        { slug: "attendance", draw: drawAttendance, pos: [4.6, 2.0, -1.2], rot: [0.05, -0.2, 0], ph: 1.3 },
        { slug: "payroll", draw: drawPayroll, pos: [1.25, -1.35, 0.6], rot: [-0.03, 0.12, 0], ph: 2.6 },
        { slug: "books", draw: drawBooks, pos: [5.3, -0.95, -0.5], rot: [-0.02, -0.22, 0], ph: 3.9 },
      ];
      const panels = SPECS.map((s) => {
        const group = new THREE.Group();
        const c = document.createElement("canvas");
        c.width = CW; c.height = CH;
        const ctx = c.getContext("2d");
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 8;
        const face = new THREE.Mesh(
          new THREE.PlaneGeometry(PW, PH),
          new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false }),
        );
        face.position.z = 0.036;
        const slab = new THREE.Mesh(
          new THREE.ExtrudeGeometry(roundedShape(PW * 0.996, PH * 0.994, 0.115), { depth: 0.06, bevelEnabled: false, curveSegments: 10 }),
          new THREE.MeshStandardMaterial({ color: 0xf1f5fb, roughness: 0.45 }),
        );
        slab.position.z = -0.026;
        const shadow = new THREE.Mesh(
          new THREE.PlaneGeometry(PW * 1.45, PH * 1.45),
          new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, opacity: 0.16, depthWrite: false, toneMapped: false }),
        );
        shadow.position.set(0.12, -0.32, -0.7);
        const rim = new THREE.Mesh(
          new THREE.PlaneGeometry(PW * 1.3, PH * 1.32),
          new THREE.MeshBasicMaterial({ map: rimTex, transparent: true, opacity: 0, depthWrite: false, toneMapped: false }),
        );
        rim.position.z = -0.06;
        group.add(shadow, rim, slab, face);
        group.position.set(...s.pos);
        group.rotation.set(...s.rot);
        scene.add(group);
        return { ...s, group, ctx, tex, rim, shadow };
      });

      /* -------------------------------------------- the line of light between them */
      const SEGS = [
        [[0.9, 1.55, -0.25], [2.8, 1.15, -0.85], [4.6, 2.0, -1.45]],
        [[4.6, 2.0, -1.45], [3.2, 0.25, -0.4], [1.25, -1.35, 0.35]],
        [[1.25, -1.35, 0.35], [3.3, -1.8, -0.2], [5.3, -0.95, -0.75]],
      ];
      const TUB = 120, RAD = 10;
      const wires = SEGS.map((pts) => {
        const curve = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(...p)), false, "centripetal");
        const base = new THREE.Mesh(
          new THREE.TubeGeometry(curve, TUB, 0.022, RAD, false),
          new THREE.MeshBasicMaterial({ color: 0xffc7a8, transparent: true, opacity: 0.85, toneMapped: false }),
        );
        const litGeo = new THREE.TubeGeometry(curve, TUB, 0.034, RAD, false);
        const lit = new THREE.Mesh(litGeo, new THREE.MeshBasicMaterial({ color: 0xff5400, transparent: true, toneMapped: false }));
        scene.add(base, lit);
        return { curve, lit, litGeo };
      });
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.075, 24, 16), new THREE.MeshBasicMaterial({ color: 0xff5400, toneMapped: false }));
      const haloCanvas = document.createElement("canvas");
      haloCanvas.width = haloCanvas.height = 256;
      {
        const g = haloCanvas.getContext("2d");
        const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
        grad.addColorStop(0, "rgba(255,120,40,0.85)");
        grad.addColorStop(0.35, "rgba(255,84,0,0.35)");
        grad.addColorStop(1, "rgba(255,84,0,0)");
        g.fillStyle = grad;
        g.fillRect(0, 0, 256, 256);
      }
      const haloTex = new THREE.CanvasTexture(haloCanvas);
      haloTex.colorSpace = THREE.SRGBColorSpace;
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, transparent: true, depthWrite: false, toneMapped: false }));
      halo.scale.set(0.9, 0.9, 1);
      scene.add(head, halo);

      /* ------------------------------------------ glass ribbons and spheres behind */
      function ribbon(points, color, opacity, radius) {
        const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)));
        const m = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 200, radius, 40, false),
          new THREE.MeshPhysicalMaterial({ color, roughness: 0.18, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.1, transparent: true, opacity }),
        );
        // flatten the tube into a ribbon around its own plane, then push it back
        const z = points[0][2];
        m.geometry.translate(0, 0, -z);
        m.scale.z = 0.14;
        m.position.z = z;
        scene.add(m);
        return m;
      }
      const ribbonA = ribbon([[-5, -7.5, -4], [-1.5, -4.6, -4], [1.8, -2.4, -4], [4.6, -0.4, -4], [7.4, 0.8, -4], [11, 0.2, -4], [14, -0.8, -4]], 0xff8a4c, 0.5, 0.55);
      const ribbonB = ribbon([[-2.5, 8.5, -5], [0.5, 5.2, -5], [3.2, 3.4, -5], [6.2, 2.9, -5], [9.5, 4.4, -5], [13, 6.5, -5]], 0x8fb8ff, 0.42, 0.6);
      const SPHERES = [
        { c: 0xff6a1f, r: 0.26, p: [-0.2, -2.35, 1.2], k: 1, ph: 0.3 },
        { c: 0x7fb2ff, r: 0.18, p: [3.3, 3.25, -0.6], k: 2, ph: 1.7 },
        { c: 0xffffff, r: 0.32, p: [6.6, 0.75, -1.8], k: 1, ph: 2.6 },
        { c: 0xff9a5c, r: 0.14, p: [3.25, 0.15, 1.4], k: 2, ph: 4.1 },
        { c: 0x9cc3ff, r: 0.22, p: [6.0, -2.6, 0.4], k: 1, ph: 5.0 },
      ].map((s) => {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(s.r, 48, 32),
          new THREE.MeshPhysicalMaterial({ color: s.c, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05, metalness: 0 }),
        );
        scene.add(m);
        return { ...s, m };
      });

      /* -------------------------------------------------------------- timing
       * 0.3 People lights · 1.0–2.2 line to Attendance · 3.4–4.6 to Payroll ·
       * 5.8–7.0 to Books · 8.8–9.6 everything settles back to the 0 s frame.
       */
      const doneCanvas = document.createElement("canvas");
      doneCanvas.width = CW;
      doneCanvas.height = CH;
      const doneCtx = doneCanvas.getContext("2d");
      const ACT = [[0.3, 1.0], [2.2, 3.6], [4.6, 5.9], [7.0, 8.1]];
      const ARRIVE = [0.3, 2.2, 4.6, 7.0];
      const RUN = [[1.0, 2.2], [3.4, 4.6], [5.8, 7.0]];
      const SETTLE = [8.8, 9.6];

      function renderAt(time) {
        const t = ((time % LOOP) + LOOP) % LOOP;
        const loop = (t / LOOP) * TAU;
        const settle = 1 - smooth(SETTLE[0], SETTLE[1], t);

        camera.position.set(0.35 * Math.cos(loop), 0.22 * Math.sin(loop), 15);
        camera.lookAt(0.12 * Math.cos(loop), 0.08 * Math.sin(loop), 0);

        let warmPos = null, warmI = 0;
        panels.forEach((pn, i) => {
          const [a, b] = ACT[i];
          const p = smooth(a, b, t);
          if (t >= SETTLE[0]) {
            // the finished screen fades back into the waiting one
            pn.draw(doneCtx, 1);
            pn.draw(pn.ctx, 0);
            pn.ctx.save();
            pn.ctx.globalAlpha = settle;
            pn.ctx.drawImage(doneCanvas, 0, 0);
            pn.ctx.restore();
          } else {
            pn.draw(pn.ctx, p);
          }
          pn.tex.needsUpdate = true;

          const lift = smooth(ARRIVE[i] - 0.2, ARRIVE[i] + 0.45, t) * settle;
          const bob = 0.07 * Math.sin(loop + pn.ph);
          pn.group.position.set(pn.pos[0], pn.pos[1] + bob, pn.pos[2] + 0.32 * lift);
          pn.group.rotation.y = pn.rot[1] * (1 - 0.35 * lift);
          const since = t - ARRIVE[i];
          const flash = since >= 0 ? Math.exp(-since * 2.2) * settle : 0;
          pn.rim.material.opacity = 0.5 * flash + 0.22 * lift;
          pn.shadow.material.opacity = 0.14 + 0.08 * lift;
          if (flash > warmI) { warmI = flash; warmPos = pn.group.position; }
        });

        let headPos = null;
        const fade = 1 - smooth(8.6, 9.4, t);
        wires.forEach((w, i) => {
          const [a, b] = RUN[i];
          const u = easeIO(clamp((t - a) / (b - a)));
          w.litGeo.setDrawRange(0, Math.floor(u * TUB) * RAD * 6);
          w.lit.material.opacity = fade;
          if (t > a && t < b) headPos = w.curve.getPointAt(u);
        });
        if (headPos) {
          head.visible = halo.visible = true;
          head.position.copy(headPos);
          halo.position.copy(headPos);
          warm.position.copy(headPos);
          warm.intensity = 6;
        } else {
          head.visible = halo.visible = false;
          if (warmPos) { warm.position.set(warmPos.x, warmPos.y, warmPos.z + 1.2); warm.intensity = 5 * warmI; }
          else warm.intensity = 0;
        }

        ribbonA.rotation.z = 0.025 * Math.sin(loop);
        ribbonB.rotation.z = -0.03 * Math.sin(loop + 1);
        SPHERES.forEach((s) => s.m.position.set(s.p[0], s.p[1] + 0.16 * Math.sin(loop * s.k + s.ph), s.p[2]));

        renderer.render(scene, camera);
      }

      async function build() {
        await Promise.all([
          document.fonts.load("800 34px Jakarta"),
          document.fonts.load("500 28px Jakarta"),
          document.fonts.load("600 24px Jakarta"),
          document.fonts.load("700 24px Jakarta"),
        ]);
        const json = await fetch("assets/icons.json").then((r) => r.json());
        await Promise.all(Object.keys(TONE).map((k) => loadIcon(k, json[k], TONE[k])));
        renderAt(window.__hfThreeTime || 0);
      }
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["clor-hero-3d"] = build();

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    </script>
  </body>
</html>
