name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    # Text-only changes (notes, trackers, plans) build nothing and test nothing: no run.
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
  # Nightly full run at 03:00 IST, whatever was merged that day.
  schedule:
    - cron: '30 21 * * *'

# A newer push replaces the run in progress, on a pull request and on main
# alike: only the latest commit's result matters (the nightly run covers any
# commit a newer one replaced). The nightly run is never cancelled.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  verify:
    # A Mac self-hosted runner (label clor-mac), not GitHub's
    # machines: the organization is on GitHub's free plan, whose Actions
    # minutes for a private repository ran out at ~75 minutes a run (Oct
    # 2026). Setup: docs/CI-ON-MAC.md.
    runs-on: [self-hosted, clor-mac]
    timeout-minutes: 120

    # The suite needs a PostgreSQL server: the server tests create a
    # database per run (`clor_test_<pid>`, the schemas, row-level security
    # policies applied and granted). On the Mac it is a PostgreSQL 16 of its
    # own on port 5434 (Homebrew postgresql@16, max_connections 300), the
    # same major version as production and apart from the developer's own
    # server on 5432, so a test run never takes the connections a dev server
    # needs. Its superuser is clor_ci / clor_ci, as the container was.
    env:
      PGHOST: localhost
      PGPORT: 5434

    steps:
      - uses: actions/checkout@v7

      # No npm cache: the runner keeps its files between runs, and saving the
      # cache to GitHub after every run took ~8 minutes on the Mac.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install frontend deps
        run: npm ci

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: server

      # Each schema.prisma must describe what its migrations build (O-12).
      # Production is built by `migrate deploy` and the test suite by `db
      # push`, so a column, default or index on only one side passes every
      # test and still differs on the box. The script replays each schema's
      # migrations into an empty shadow database and runs
      #   prisma migrate diff --from-migrations <dir> --to-schema-datamodel
      #     <schema> --shadow-database-url <url> --exit-code
      # for all four; any difference fails the build. The one difference it
      # allows, and why, is written at the top of the script.
      - name: Schema and migrations agree
        working-directory: server
        env:
          PGPASSWORD: clor_ci
          # One shadow database per run: several runners share this Postgres.
          SHADOW_DB: clor_shadow_${{ github.run_id }}_${{ github.run_attempt }}
        # A run cancelled halfway leaves the shadow database behind on a runner that persists.
        run: |
          dropdb --if-exists -U clor_ci "$SHADOW_DB"
          createdb -U clor_ci "$SHADOW_DB"
          SHADOW_DATABASE_URL="postgresql://clor_ci:clor_ci@localhost:5434/$SHADOW_DB" node scripts/checkMigrationDrift.mjs
          dropdb -U clor_ci "$SHADOW_DB"

      - name: Lint
        run: npm run lint

      - name: Typecheck server
        run: npm run typecheck

      # Every route that changes something must check a permission or an
      # entitlement, and every public or token route must be named, with a
      # reason, in tenant-platform-upgrade-2026-10-23/route-allowlist.json
      # (A-49). Reads the source with the TypeScript compiler; no database.
      - name: Route manifest gate
        run: node tenant-platform-upgrade-2026-10-23/scripts/inventory-routes.mjs --check

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: npm run build
        working-directory: server

  # The server suite, split three ways across the Mac's runners (docs/CI-ON-MAC.md):
  # ~32 minutes as one job, ~11 as three side by side.
  #
  # Not on pull requests (30 Oct 2026): a pull request gets the quick checks
  # in `verify` (lint, schema, typecheck, build, minutes); the server suite
  # runs after merge on main, nightly, by hand, or on a pull request labelled
  # `full-tests`. Three Mac runners could not keep up with a full suite per
  # pull request.
  server-tests:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')
    runs-on: [self-hosted, clor-mac]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      PGHOST: localhost
      PGPORT: 5434
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: server

      - name: Server tests
        # Each shard still runs its files one at a time (see vitest.config.ts) against
        # a database of its own (clor_test_<pid>), so the shards cannot disturb each other.
        run: npx vitest run --shard=${{ matrix.shard }}/3
        working-directory: server
        env:
          JWT_SECRET: ci-test-secret
          # Two connections, and the difference between them is the point.
          #
          # PGADMIN_URL is the superuser the run borrows to create its own
          # database, push the schemas and apply the policies. DATABASE_URL is
          # the role the TESTS connect as, and it must not be that superuser:
          # PostgreSQL skips every row-level-security policy for a superuser,
          # so pointing both at clor_ci made rowLevelSecurity.test.ts read
          # another company's rows — and fail, correctly. The suite had been
          # asked to prove RLS through a role the policies do not apply to.
          #
          # globalSetup creates clor_app with this password, NOSUPERUSER and
          # NOBYPASSRLS, which is the arrangement production runs.
          PGADMIN_URL: postgresql://clor_ci:clor_ci@localhost:5434/postgres
          DATABASE_URL: postgresql://clor_app:clor_ci_app@localhost:5434/postgres
          CLOR_APP_ROLE: clor_app
          CLOR_APP_PASSWORD: clor_ci_app


  # Deploy runs only after verify and the server tests pass, only on main, and never on a pull
  # request from a fork. A green build is the entry condition: the point of
  # this pipeline is that nothing reaches the server that did not pass the
  # tests first.
  #
  # This job deploys to the legacy VM over SSH. Production now runs on Cloud
  # Run, so it stays off unless the repository variable DEPLOY_VM_ENABLED is
  # set to 'true' (and the DEPLOY_* secrets exist).
  deploy:
    needs: [verify, server-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_VM_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      # Two deploys rsyncing the same directory at once would interleave
      # files. Newer wins; the older one is cancelled.
      group: deploy-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Authorise the runner against the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY is not set"; exit 1; }
          test -n "$DEPLOY_HOST"    || { echo "DEPLOY_HOST is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pin the host key rather than accepting blindly, so a hijacked DNS
          # answer cannot collect the deploy key.
          if [ -n "${{ secrets.DEPLOY_HOST_KEY }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Upload frontend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" \
            dist/ "ubuntu@$DEPLOY_HOST:/opt/clor/web/"

      - name: Upload API, migrate and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude 'prisma/*.db' --exclude dist \
            -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" \
            server/ "ubuntu@$DEPLOY_HOST:/opt/clor/server/"
          ssh -i ~/.ssh/deploy -o BatchMode=yes "ubuntu@$DEPLOY_HOST" 'set -e
            cd /opt/clor/server
            set -a; . /opt/clor/.env; set +a
            # A dump before anything is installed or migrated. A backup taken
            # after a migration is a backup of the problem. As the postgres
            # superuser: every tenant table FORCEs row-level security, so
            # pg_dump as the owner refuses rather than dumping half a table.
            mkdir -p /opt/clor/backups
            sudo -u postgres pg_dump -d clor \
              | gzip > "/opt/clor/backups/clor-ci-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            ls -1t /opt/clor/backups/clor-*.sql.gz | tail -n +15 | xargs -r rm --
            # --include=dev explicitly: /opt/clor/.env sets NODE_ENV=production,
            # which makes npm skip devDependencies — and tsc lives there, so the
            # build fails with "tsc: not found".
            npm ci --include=dev --no-audit --no-fund
            # Two databases, two clients: payroll keeps its own.
            npx prisma generate
            npx prisma generate --schema prisma/payroll/schema.prisma
            npx prisma generate --schema prisma/people/schema.prisma
            # The pre-deploy check earns the --accept-data-loss below.
            #
            # Prisma refuses to add a unique constraint without that flag,
            # because it cannot know whether the column already holds
            # duplicates. Passing it blindly would mean every future deploy
            # silently accepts real loss, so the check runs first and exits 1
            # when anything would actually be lost; `set -e` then stops the
            # deploy before the schema is touched. The flag says "verified",
            # not "ignore".
            npx tsx scripts/preflight.ts
            # Versioned migrations, and a one-time baseline for the database
            # db push built. See server/prisma/migrations/README.md.
            npx tsx scripts/migrate.ts
            # Grants, after the migrations that created the tables to grant on.
            # A table this deploy adds is unreadable by the application role
            # until this runs, and the symptom is a permission error on one
            # screen rather than a failed deploy.
            node scripts/provisionAppRole.mjs
            npm run build
            sudo systemctl restart clor-api'

      - name: Check the site is still answering
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          URL="${DEPLOY_URL:-https://68.233.107.83.sslip.io}"

          # The API is the thing that was just restarted, so it is the one that
          # needs time — and it was the only one without a retry. Caddy answers
          # 502 for the second or two before node is listening again, which
          # failed the check on a deploy that had in fact worked.
          #
          # 401 is the healthy answer: the API is alive and asking who you are.
          # A 200 there would mean an unauthenticated endpoint.
          for i in $(seq 1 20); do
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/api/health" || true)
            [ "$api" = "401" ] && break
            echo "api:  $api (attempt $i, waiting for the service to come back)"
            sleep 5
          done

          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done

          echo "app:  $code"
          echo "api:  $api"
          [ "$code" = "200" ] && [ "$api" = "401" ]
