name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    # `labeled`: adding the full-tests label starts the full server suite on
    # that pull request itself, so no second run by hand is needed. Any other
    # label does nothing (each job checks).
    types: [opened, synchronize, reopened, labeled]
    # Text-only changes (notes, trackers, plans) build nothing and test nothing: no run.
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
  # Nightly full run at 03:00 IST, whatever was merged that day.
  schedule:
    - cron: '30 21 * * *'

# A newer push replaces the run in progress, on a pull request and on main
# alike: only the latest commit's result matters (the nightly run covers any
# commit a newer one replaced). The nightly run and a run started by hand
# (the release check on a chosen commit) are never cancelled.
concurrency:
  # A label other than full-tests is a run of its own that does nothing, so it never cancels the real one.
  group: ci-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'full-tests') && format('label-{0}', github.run_id) || github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

# GitHub's machines run on UTC; the Mac ran on India time, and some tests
# (dates shown to the user) were written against it. Customers are in India.
env:
  TZ: Asia/Kolkata

jobs:
  verify:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-tests'
    # GitHub's own machines (14 Nov 2026). The repository is public, so
    # standard runners cost nothing, and a public repository must not run on
    # a self-hosted machine: a pull request from any fork could run code on it.
    # Until then the jobs ran on the Mac (docs/CI-ON-MAC.md) because the free
    # plan's minutes for a private repository ran out at ~75 minutes a run.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # The suite needs a PostgreSQL server: the server tests create a database
    # per run (`clor_test_<pid>`, the schemas, row-level security policies
    # applied and granted). .github/actions/postgres starts PostgreSQL 16 on
    # port 5434 with superuser clor_ci / clor_ci and 300 connections, which is
    # what the Mac had, so nothing in the tests changes.
    env:
      PGHOST: localhost
      PGPORT: 5434

    steps:
      - uses: actions/checkout@v7

      # A fresh machine every run: npm's download cache is kept by GitHub.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - uses: ./.github/actions/postgres

      - name: Install frontend deps
        run: npm ci

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: server

      # Each schema.prisma must describe what its migrations build (O-12).
      # Production is built by `migrate deploy` and the test suite by `db
      # push`, so a column, default or index on only one side passes every
      # test and still differs on the box. The script replays each schema's
      # migrations into an empty shadow database and runs
      #   prisma migrate diff --from-migrations <dir> --to-schema-datamodel
      #     <schema> --shadow-database-url <url> --exit-code
      # for all four; any difference fails the build. The one difference it
      # allows, and why, is written at the top of the script.
      - name: Schema and migrations agree
        working-directory: server
        env:
          PGPASSWORD: clor_ci
          SHADOW_DB: clor_shadow
        run: |
          createdb -U clor_ci "$SHADOW_DB"
          SHADOW_DATABASE_URL="postgresql://clor_ci:clor_ci@localhost:5434/$SHADOW_DB" node scripts/checkMigrationDrift.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck server
        run: npm run typecheck

      # Every route that changes something must check a permission or an
      # entitlement, and every public or token route must be named, with a
      # reason, in tenant-platform-upgrade-2026-10-23/route-allowlist.json
      # (A-49). Reads the source with the TypeScript compiler; no database.
      - name: Route manifest gate
        run: node tenant-platform-upgrade-2026-10-23/scripts/inventory-routes.mjs --check

      # The web suite (vitest at the repository root: Accounting, People,
      # Payroll and the shared packages, ~1,800 tests in jsdom). About four minutes
      # and no database, so it runs on every pull request. It ran nowhere
      # before 30 Oct 2026 and 53 tests had rotted unseen. The config's thread
      # count: each job has its machine to itself. No retries — a flaky test
      # is fixed, not re-run.
      - name: Web tests
        run: npm run test:web

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: npm run build
        working-directory: server

  # The server suite, split three ways, each shard on a machine of its own.
  #
  # Runs nightly, by hand (workflow_dispatch: before every deploy), and on a
  # pull request labelled `full-tests`. Not after a merge to main (11 Nov
  # 2026): the pull request was already checked, the push only repeated it and
  # held all three runners for ~30 minutes while pull requests queued; the
  # nightly run covers main. A pull request without the label runs the server
  # tests for what it changed (server-tests-related).
  server-tests:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-tests') && (github.event.action != 'labeled' || github.event.label.name == 'full-tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      PGHOST: localhost
      PGPORT: 5434
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - uses: ./.github/actions/postgres

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: server

      - name: Server tests
        # Each shard still runs its files one at a time (see vitest.config.ts) against
        # a database of its own (clor_test_<pid>), so the shards cannot disturb each other.
        run: npx vitest run --shard=${{ matrix.shard }}/3
        working-directory: server
        env:
          JWT_SECRET: ci-test-secret
          # Two connections, and the difference between them is the point.
          #
          # PGADMIN_URL is the superuser the run borrows to create its own
          # database, push the schemas and apply the policies. DATABASE_URL is
          # the role the TESTS connect as, and it must not be that superuser:
          # PostgreSQL skips every row-level-security policy for a superuser,
          # so pointing both at clor_ci made rowLevelSecurity.test.ts read
          # another company's rows — and fail, correctly. The suite had been
          # asked to prove RLS through a role the policies do not apply to.
          #
          # globalSetup creates clor_app with this password, NOSUPERUSER and
          # NOBYPASSRLS, which is the arrangement production runs.
          PGADMIN_URL: postgresql://clor_ci:clor_ci@localhost:5434/postgres
          DATABASE_URL: postgresql://clor_app:clor_ci_app@localhost:5434/postgres
          CLOR_APP_ROLE: clor_app
          CLOR_APP_PASSWORD: clor_ci_app


  # A pull request without the full-tests label: the server test files that
  # import what it changed or are named after it, in one job, usually minutes. A
  # change to a schema or migration runs the whole suite here, since no test
  # imports a .prisma file. Anything this misses is caught by the nightly
  # full run, and the full suite runs by hand before every deploy.
  server-tests-related:
    if: github.event_name == 'pull_request' && github.event.action != 'labeled' && !contains(github.event.pull_request.labels.*.name, 'full-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PGHOST: localhost
      PGPORT: 5434
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - uses: ./.github/actions/postgres

      - name: What changed on the server
        id: changed
        # The test files that import what changed, or are named after it
        # (scripts/ci/related-server-tests.mjs). A schema, migration or test
        # setup change runs the whole suite.
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          tests=$(node scripts/ci/related-server-tests.mjs $(git diff --name-only --diff-filter=ACMR "$base...HEAD") | tr '\n' ' ')
          schema=$(git diff --name-only "$base...HEAD" -- server/prisma server/package.json server/vitest.config.ts server/src/__tests__/setup server/src/__tests__/globalSetup.ts | head -1)
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "all=$([ -n "$schema" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "Tests for this change: ${tests:-none}"
          echo "Schema or test setup changed: ${schema:-no}"

      - name: Install server deps
        if: steps.changed.outputs.tests != '' || steps.changed.outputs.all == 'yes'
        run: npm ci
        working-directory: server

      - name: Generate Prisma client
        if: steps.changed.outputs.tests != '' || steps.changed.outputs.all == 'yes'
        run: npm run prisma:generate
        working-directory: server

      - name: Server tests for what changed
        if: steps.changed.outputs.tests != '' || steps.changed.outputs.all == 'yes'
        working-directory: server
        run: |
          if [ "${{ steps.changed.outputs.all }}" = yes ]; then npx vitest run; else npx vitest run ${{ steps.changed.outputs.tests }}; fi
        env:
          JWT_SECRET: ci-test-secret
          PGADMIN_URL: postgresql://clor_ci:clor_ci@localhost:5434/postgres
          DATABASE_URL: postgresql://clor_app:clor_ci_app@localhost:5434/postgres
          CLOR_APP_ROLE: clor_app
          CLOR_APP_PASSWORD: clor_ci_app

  # End-to-end (e2e/README.md): Playwright drives the real web app and the
  # employee app, desktop 1440×900 and phone 390×844, through the scenarios of
  # docs/people/qa/PERSONA-SCENARIOS.md. It boots its own API and web app on
  # ports of its own and builds a database of its own on the CI Postgres (5434),
  # dropped at the end. A pull request runs the @smoke set (e2e-smoke); the
  # nightly run and a run by hand run every scenario (e2e-full). One retry in
  # CI; a test that needed it shows as flaky in the report.
  #
  # Each run has a machine of its own, so the Mac-wide lock that kept two
  # end-to-end runs apart (31 Oct 2026, scripts/ci/one-at-a-time.sh) is not
  # needed here.
  e2e:
    needs: [verify, server-tests, server-tests-related]
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.event_name != 'push' }}
    name: ${{ github.event_name == 'pull_request' && 'e2e-smoke' || 'e2e-full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PGHOST: localhost
      PGPORT: 5434
      PGPASSWORD: clor_ci
      E2E_PGADMIN_URL: postgresql://clor_ci:clor_ci@localhost:5434/postgres
      E2E_DB_NAME: clor_e2e_${{ github.run_id }}_${{ github.run_attempt }}
      E2E_WORKERS: 2
      # Connections per schema for the run's API: 5434 has 300; a People screen sends ~20 requests at once.
      E2E_DB_POOL: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - uses: ./.github/actions/postgres

      - name: Install frontend deps
        run: npm ci

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: server

      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Typecheck the end-to-end tests
        run: npx tsc -p e2e

      # Ports clear of PostgreSQL (5432/5434) and anything else on the machine,
      # and of the ports browsers refuse to open (6566, 6665-6669, 6697...: a
      # run once drew 6665 and Chrome answered ERR_UNSAFE_PORT). 7100-7599 has none.
      - name: Ports for this run
        run: |
          echo "E2E_API_PORT=$((4400 + ${{ github.run_id }} % 500))" >> "$GITHUB_ENV"
          echo "E2E_WEB_PORT=$((7100 + ${{ github.run_id }} % 500))" >> "$GITHUB_ENV"

      - name: End-to-end, smoke set
        if: github.event_name == 'pull_request'
        run: npm run e2e:smoke
        env:
          E2E_SKIP_GENERATE: '1'

      - name: End-to-end, every scenario
        if: github.event_name != 'pull_request'
        run: npm run e2e
        env:
          E2E_SKIP_GENERATE: '1'

      - name: Results by scenario
        if: always()
        run: node e2e/scripts/results.mjs || true

      - name: Upload the report
        if: always()
        # A full artifact store must not fail a run whose tests passed: the
        # results are already in the log ("Results by scenario").
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/report/
            e2e/test-results/
            docs/people/qa/E2E-RESULTS.md
          retention-days: 5
          if-no-files-found: ignore


  # The same scenarios against staging, nightly. Off until the owner adds the
  # secrets and sets the repository variable E2E_STAGING_ENABLED to 'true'
  # (docs/CI-ON-MAC.md, "End-to-end tests"). Smoke set, desktop, one worker:
  # staging keeps its sign-up and sign-in rate limits.
  e2e-staging:
    if: github.event_name == 'schedule' && vars.E2E_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_TARGET: staging
      E2E_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
      E2E_API_URL: ${{ secrets.E2E_STAGING_API_URL }}
      E2E_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD }}
      E2E_WORKERS: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end against staging
        run: npm run e2e:smoke -- --project=desktop

      - name: Results by scenario
        if: always()
        run: node e2e/scripts/results.mjs || true

      - name: Upload the report
        if: always()
        # A full artifact store must not fail a run whose tests passed: the
        # results are already in the log ("Results by scenario").
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-staging-report-${{ github.run_id }}
          path: |
            e2e/report/
            e2e/test-results/
            docs/people/qa/E2E-RESULTS.md
          retention-days: 5
          if-no-files-found: ignore

  # Deploy runs only after verify and the server tests pass, only on main, and never on a pull
  # request from a fork. A green build is the entry condition: the point of
  # this pipeline is that nothing reaches the server that did not pass the
  # tests first.
  #
  # This job deploys to the legacy VM over SSH. Production now runs on Cloud
  # Run, so it stays off unless the repository variable DEPLOY_VM_ENABLED is
  # set to 'true' (and the DEPLOY_* secrets exist).
  deploy:
    needs: [verify, server-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_VM_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      # Two deploys rsyncing the same directory at once would interleave
      # files. Newer wins; the older one is cancelled.
      group: deploy-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Authorise the runner against the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY is not set"; exit 1; }
          test -n "$DEPLOY_HOST"    || { echo "DEPLOY_HOST is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pin the host key rather than accepting blindly, so a hijacked DNS
          # answer cannot collect the deploy key.
          if [ -n "${{ secrets.DEPLOY_HOST_KEY }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Upload frontend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" \
            dist/ "ubuntu@$DEPLOY_HOST:/opt/clor/web/"

      - name: Upload API, migrate and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude 'prisma/*.db' --exclude dist \
            -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" \
            server/ "ubuntu@$DEPLOY_HOST:/opt/clor/server/"
          ssh -i ~/.ssh/deploy -o BatchMode=yes "ubuntu@$DEPLOY_HOST" 'set -e
            cd /opt/clor/server
            set -a; . /opt/clor/.env; set +a
            # A dump before anything is installed or migrated. A backup taken
            # after a migration is a backup of the problem. As the postgres
            # superuser: every tenant table FORCEs row-level security, so
            # pg_dump as the owner refuses rather than dumping half a table.
            mkdir -p /opt/clor/backups
            sudo -u postgres pg_dump -d clor \
              | gzip > "/opt/clor/backups/clor-ci-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            ls -1t /opt/clor/backups/clor-*.sql.gz | tail -n +15 | xargs -r rm --
            # --include=dev explicitly: /opt/clor/.env sets NODE_ENV=production,
            # which makes npm skip devDependencies — and tsc lives there, so the
            # build fails with "tsc: not found".
            npm ci --include=dev --no-audit --no-fund
            # Two databases, two clients: payroll keeps its own.
            npx prisma generate
            npx prisma generate --schema prisma/payroll/schema.prisma
            npx prisma generate --schema prisma/people/schema.prisma
            # The pre-deploy check earns the --accept-data-loss below.
            #
            # Prisma refuses to add a unique constraint without that flag,
            # because it cannot know whether the column already holds
            # duplicates. Passing it blindly would mean every future deploy
            # silently accepts real loss, so the check runs first and exits 1
            # when anything would actually be lost; `set -e` then stops the
            # deploy before the schema is touched. The flag says "verified",
            # not "ignore".
            npx tsx scripts/preflight.ts
            # Versioned migrations, and a one-time baseline for the database
            # db push built. See server/prisma/migrations/README.md.
            npx tsx scripts/migrate.ts
            # Grants, after the migrations that created the tables to grant on.
            # A table this deploy adds is unreadable by the application role
            # until this runs, and the symptom is a permission error on one
            # screen rather than a failed deploy.
            node scripts/provisionAppRole.mjs
            npm run build
            sudo systemctl restart clor-api'

      - name: Check the site is still answering
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          URL="${DEPLOY_URL:-https://68.233.107.83.sslip.io}"

          # The API is the thing that was just restarted, so it is the one that
          # needs time — and it was the only one without a retry. Caddy answers
          # 502 for the second or two before node is listening again, which
          # failed the check on a deploy that had in fact worked.
          #
          # 401 is the healthy answer: the API is alive and asking who you are.
          # A 200 there would mean an unauthenticated endpoint.
          for i in $(seq 1 20); do
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/api/health" || true)
            [ "$api" = "401" ] && break
            echo "api:  $api (attempt $i, waiting for the service to come back)"
            sleep 5
          done

          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done

          echo "app:  $code"
          echo "api:  $api"
          [ "$code" = "200" ] && [ "$api" = "401" ]
