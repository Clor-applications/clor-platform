name: Android — CLOR Accounting

# Builds the Android app from the web build (mobile/accounting, Capacitor).
#
#   - On a tag `accounting-v1.2.3`: a signed release APK and AAB (the AAB is
#     what Play Console takes), when the signing secrets are set; a debug APK
#     otherwise. The APK is also published to the clor-downloads Pages site
#     when the Cloudflare secrets are set, so accounting.clor.in/download/ links to it.
#   - On "Run workflow": the same, from whatever branch is chosen.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the upload keystore, base64 (base64 -i clor-upload.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   (optional: publishes the APK to the
#                       clor-downloads Pages project, which the download pages read)

on:
  push:
    tags: ['accounting-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-{0}', github.run_number) }}
      # `secrets` cannot be read in a step's `if`, so the presence checks live here.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ships the Android SDK (ANDROID_HOME set); Gradle fetches
      # the exact platform/build-tools it needs once the licences are accepted.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          cd mobile/accounting && npm ci --no-audit --no-fund

      - name: Web build pinned to Accounting, copied into the Android project
        run: npm run build:mobile:accounting

      - name: Version from the tag
        # accounting-v1.2.3 → versionName 1.2.3, versionCode = run number (always increasing).
        run: |
          NAME="${VERSION_NAME#accounting-v}"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NAME\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" mobile/accounting/android/app/build.gradle
          grep -E "versionName|versionCode" mobile/accounting/android/app/build.gradle

      - name: Signing (release) when the keystore is set
        id: signing
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile/accounting/android/upload.jks
          cat >> mobile/accounting/android/gradle.properties <<EOF
          CLOR_STORE_FILE=../upload.jks
          CLOR_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLOR_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          CLOR_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: mobile/accounting/android
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.release }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect
        run: |
          mkdir -p out
          find mobile/accounting/android/app/build/outputs -name '*.apk' -exec cp {} out/ \;
          find mobile/accounting/android/app/build/outputs -name '*.aab' -exec cp {} out/ \; || true
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: clor-accounting-android-${{ env.VERSION_NAME }}
          path: out/*
          if-no-files-found: error

      - name: Publish the APK to the download site
        # One Pages project (clor-downloads) serves every app's latest APK. A
        # deploy replaces the whole site, so the other apps' current files are
        # fetched first and shipped again alongside this one.
        if: steps.signing.outputs.release == 'true' && env.HAS_CF == 'true'
        run: |
          set -e
          APK=$(ls out/*release*.apk | head -1)
          VER="${VERSION_NAME#accounting-v}"
          BASE="https://clor-downloads.pages.dev"
          mkdir -p site
          for other in attendance payroll accounting; do
            [ "$other" = "accounting" ] && continue
            curl -fsSL "$BASE/clor-$other-latest.json" -o "site/clor-$other-latest.json" || { rm -f "site/clor-$other-latest.json"; continue; }
            curl -fsSL "$BASE/clor-$other-latest.apk" -o "site/clor-$other-latest.apk" || rm -f "site/clor-$other-latest.json" "site/clor-$other-latest.apk"
          done
          cp "$APK" "site/clor-accounting-latest.apk"
          echo "{\"app\":\"accounting\",\"version\":\"$VER\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"apk\":\"clor-accounting-latest.apk\"}" > "site/clor-accounting-latest.json"
          printf '/*\n  Access-Control-Allow-Origin: *\n' > site/_headers
          ls -la site

      - uses: cloudflare/wrangler-action@v4
        if: steps.signing.outputs.release == 'true' && env.HAS_CF == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=clor-downloads --branch=main --commit-dirty=true
