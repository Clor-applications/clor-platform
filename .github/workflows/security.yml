name: Security

# Dependency and secret scanning on every push, pull request and weekly (SX-03).
#
#   audit    npm audit of what ships (production dependencies) in the web app
#            and the API; a high or critical advisory fails the run.
#   secrets  gitleaks over the commits a push or pull request adds, and over
#            the whole working tree on the weekly run. A key that reaches the
#            repository is a key to rotate, so this fails the run too.
#
# Weekly dependency updates come from Dependabot (.github/dependabot.yml).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 3 * * 1' # Mondays 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reads the lockfiles; nothing is installed.
      - name: Web app (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: API (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: server

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commits this push or pull request adds
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before"; scan the one commit it points at.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1 $AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git --no-banner --redact --verbose --config /repo/.gitleaks.toml --log-opts="$RANGE" /repo

      - name: Whole working tree
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            dir --no-banner --redact --verbose --config /repo/.gitleaks.toml /repo
