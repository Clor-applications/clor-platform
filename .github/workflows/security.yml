name: Security

# Dependency and secret scanning on every push, pull request and weekly (SX-03).
#
#   audit    npm audit of what ships (production dependencies) in the web app
#            and the API; a high or critical advisory fails the run.
#   secrets  gitleaks over the commits a push or pull request adds, and over
#            the whole working tree on the weekly run. A key that reaches the
#            repository is a key to rotate, so this fails the run too.
#
# Weekly dependency updates come from Dependabot (.github/dependabot.yml).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 3 * * 1' # Mondays 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # GitHub's own machines: see ci.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Reads the lockfiles; nothing is installed.
      - name: Web app (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: API (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: server

  secrets:
    # GitHub's own machines: see ci.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned, and checked against the release's own checksum before it runs.
      - name: gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks && rm gitleaks.tgz
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Commits this push or pull request adds
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before"; scan the one commit it points at.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1 $AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          gitleaks git --no-banner --redact --verbose --config .gitleaks.toml --log-opts="$RANGE" .

      - name: Whole working tree
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          gitleaks dir --no-banner --redact --verbose --config .gitleaks.toml .
