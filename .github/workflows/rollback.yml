name: Roll back

# Moves every customer back to an earlier release of the API: the server
# starts that release's image again (scripts/release-aws.sh --rollback).
# Nothing is built, nothing is published, and no migration is undone.
#
# Started from the Engineering Console (Releases, Roll back) or from this
# page. It runs in its own environment, `production-rollback`. On AWS it signs
# in as the same role a release uses (deploy/aws/clor.cloudformation.yaml,
# ReleaseRole): a rollback is a command on the server, and AWS has no narrower
# permission for "start an older image". Because that role can do everything
# a release can, give `production-rollback` the same required reviewer as
# `production` (the owner's choice of 15 Nov 2026: a rollback needs approval).

on:
  workflow_dispatch:
    inputs:
      revision:
        description: The release to go back to, as seven characters of its commit, e.g. ad81ab7 (its image must still be in the image store)
        type: string
        required: true
      reason:
        description: Why
        type: string
        required: true

run-name: Roll back to ${{ inputs.revision }}

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-rollback
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A rollback runs from main, not from $GITHUB_REF."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: rollback-${{ github.run_id }}

      - name: Roll back
        env:
          REVISION: ${{ inputs.revision }}
          REASON: ${{ inputs.reason }}
        run: |
          printf 'Asked for by %s. Reason: %s\n' "$GITHUB_ACTOR" "$REASON"
          scripts/release-aws.sh --rollback "$REVISION" --go
