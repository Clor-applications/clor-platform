# The Console page and its /api forwarder (functions/api/[[path]].js).
# Publish from this folder, after `npm run console:build` at the repository root:
#   wrangler pages deploy
name = "clor-console"
pages_build_output_dir = "../../dist-console"
compatibility_date = "2026-10-01"

[vars]
# The Console API on the AWS server (deploy/aws, the compose service
# "console"), since 24 Nov 2026. Empty would make the forwarder answer 503
# "not set up yet". Before that it was the Cloud Run address
# https://clor-console-398490688104.asia-south1.run.app
ORIGIN = "https://console-origin.clor.in"
